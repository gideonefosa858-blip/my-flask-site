<!DOCTYPE html>
<html>
<head>
    <title>Contacts</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }
        nav {
            background-color: #2b6cb0;
            padding: 15px;
        }
        nav a {
            color: white;
            margin: 0 15px;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
        }
        h1 {
            color: #2b6cb0;
            margin-top: 40px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/projects">Projects</a>
        <a href="/contact">Contact</a>
        <a href="/contacts">Contacts</a>
        <a href="/password-checker">Password Checker</a>
    </nav>
    <h1>Saved Contacts</h1>
    <ul>
        {% for name, number in contacts.items() %}
            <li>{{ name }}: {{ number }}</li>
        {% endfor %}
    </ul>
</body>
</html>
